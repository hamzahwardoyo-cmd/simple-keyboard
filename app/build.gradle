apply plugin: 'com.android.application'

android {
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "rkr.simplekeyboard.inputmethod"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 149
        versionName "6.8"

        def cfAccountId = System.getenv("CF_ACCOUNT_ID") ?: ""
        def cfApiToken = System.getenv("CF_API_TOKEN") ?: ""
        buildConfigField "String", "CF_ACCOUNT_ID", "\"${cfAccountId}\""
        buildConfigField "String", "CF_API_TOKEN", "\"${cfApiToken}\""
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'rkr.simplekeyboard.inputmethod'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
}
